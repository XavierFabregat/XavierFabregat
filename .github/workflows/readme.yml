name: Refresh profile cards

# Regenerates the committed neofetch cards so their stats stay current. The
# cards are committed rather than hot-linked: a `<picture>` cannot fail over
# between URLs, so pointing at a live endpoint means an outage shows a broken
# image. Fetching here keeps the last good card in place instead.

on:
  workflow_dispatch:
  schedule:
    # 04:10 UTC daily, off the hour to avoid the scheduler's busiest minute
    - cron: "10 4 * * *"

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh and commit cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Allowed to fail: the script discards bad responses and leaves the good
      # cards alone, so a bad day upstream must not stop the commit step from
      # running - but the job should still end red so the failure is visible.
      - name: Refresh cards
        id: refresh
        continue-on-error: true
        run: scripts/refresh-cards.sh

      - name: Commit if the cards changed
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "cards unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh profile cards"
          git push

      - name: Report an upstream failure
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::warning::The card generator did not return a usable card for at least one theme. The committed cards were left in place."
          exit 1
